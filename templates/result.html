<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Météo à {{.CommuneName}}</title>
  </head>
  <body>
    <h1>Météo à {{.CommuneName}}</h1>
    {{range $i, $date := .Daily.Time}}
    <section>
      <h2>{{frDate $date}}</h2>

      <p>Min : {{formatTemp (index $.Daily.TemperatureMin $i)}}</p>
      <p>Max : {{formatTemp (index $.Daily.TemperatureMax $i)}}</p>

      <p>{{weatherIcon (index $.Daily.WeatherCode $i)}}</p>
      <p>{{weatherLabel (index $.Daily.WeatherCode $i)}}</p>
    </section>
    {{end}}
  </body>
</html>
