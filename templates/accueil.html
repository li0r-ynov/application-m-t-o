<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accueil - Météo</title>
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Quelle météo fait-il chez vous ?</h1>
      <p>
        Recherchez une commune pour consulter ses prévisions météorologiques.
      </p>

      <form action="/ville" method="GET" class="search-form">
        <input
          type="text"
          name="q"
          class="search-input"
          placeholder="Exemple : Aix-en-Provence"
          required
        />
        <button type="submit" class="search-button">Rechercher</button>
      </form>
    </main>
  </body>
</html>
